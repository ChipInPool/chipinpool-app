name: EAS Build & Submit

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      auto_submit:
        description: 'Auto-submit to stores after build'
        required: true
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build & Submit iOS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Update App Store metadata
        if: ${{ github.event_name == 'push' || github.event.inputs.auto_submit == 'true' }}
        run: eas metadata:push --platform ios --non-interactive
        continue-on-error: true

      - name: Build iOS
        run: eas build --platform ios --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive --no-wait

      - name: Submit to App Store
        if: ${{ github.event_name == 'push' || github.event.inputs.auto_submit == 'true' }}
        run: eas submit --platform ios --latest --non-interactive
        continue-on-error: true

  build-android:
    name: Build & Submit Android
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create Google Play service account key
        if: ${{ github.event_name == 'push' || github.event.inputs.auto_submit == 'true' }}
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > ./google-services.json

      - name: Update Google Play metadata
        if: ${{ github.event_name == 'push' || github.event.inputs.auto_submit == 'true' }}
        run: eas metadata:push --platform android --non-interactive
        continue-on-error: true

      - name: Build Android
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive --no-wait

      - name: Submit to Google Play
        if: ${{ github.event_name == 'push' || github.event.inputs.auto_submit == 'true' }}
        run: eas submit --platform android --latest --non-interactive
        continue-on-error: true

      - name: Cleanup service account key
        if: always()
        run: rm -f ./google-services.json
