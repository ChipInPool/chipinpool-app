name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:push

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          # Copy dist folder (keeping structure for npm start to work)
          cp -r dist deploy/
          # Copy package files
          cp package.json deploy/
          cp package-lock.json deploy/
          # Copy Azure config
          cp web.config deploy/ 2>/dev/null || true
          # Create a minimal package.json for production
          cd deploy
          # Install only production dependencies
          npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
          # Clean up unnecessary files
          rm -rf node_modules/.cache 2>/dev/null || true
          find node_modules -name "*.md" -delete 2>/dev/null || true
          find node_modules -name "*.ts" -not -name "*.d.ts" -delete 2>/dev/null || true
          
      - name: Check package size and verify files
        run: |
          du -sh deploy/
          du -sh deploy/node_modules/ || echo "No node_modules"
          echo "=== Checking deployed JS files ==="
          ls -la deploy/dist/public/assets/*.js || echo "No JS files found"
          echo "=== Searching for Stripe error handling code ==="
          grep -l "Failed to initialize Stripe" deploy/dist/public/assets/*.js || echo "New Stripe code NOT found!"
          
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
          clean: true
